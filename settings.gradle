def localPropertiesFile = new File(rootDir, "local.properties")
if (!localPropertiesFile.exists()) {
    def sdkPath = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkPath) {
        localPropertiesFile.text = "sdk.dir=${sdkPath.replace("\\", "\\\\")}\n"
    }
}

rootProject.name = "android-sabycom"
include ':sabycom'

// Demo app is optional and can pull legacy plugins incompatible with newer AGP/Gradle.
// Enable it explicitly when needed: -PincludeSabycomDemo=true
if ("true".equalsIgnoreCase(gradle.startParameter.projectProperties["includeSabycomDemo"])) {
    include ':sabycomdemo'
}
